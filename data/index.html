<!DOCTYPE html>
<html>
  <head>
    <title>3D Printer Temperature Monitor</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" type="image/png" href="favicon.png">
    <link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.7.2/css/all.css" integrity="sha384-fnmOCqbTlWIlj8LyTjo7mOUStjsKC4pOpQbqyi7RrhN7udi9RwhKkMHpvLbHG9Sr" crossorigin="anonymous">
    <link rel="stylesheet" type="text/css" href="style.css">
    <script src="http://cdn.rawgit.com/Mikhus/canvas-gauges/gh-pages/download/2.1.7/all/gauge.min.js"></script>
  </head>
  <body>
    <div class="topnav">
      <h1>3D Printer Temperature Monitor</h1>
      <div style="grid-column:2; justify-self:end; align-self:start;width:150px;">
        <a href="/update" class="link-button" title="Update Firmware">Update</a>
      </div>
    </div>
    <div class="content">
      <div class="status-card">
        <h2>3D Printer Environment Status</h2>
        <div id="printer-status" class="status-display not-ready" title="Click to change filament" style="cursor: pointer;">
          <span class="status-text">NOT READY</span>
        </div>
        <div style="margin-top: 8px; color: #666; font-size: 0.9rem;">Click status to change filament</div>
        <div id="fan-status" class="status-display ready" style="margin-top: 12px;">
          <span class="status-text">FAN OFF</span>
        </div>
      </div>
      <details class="expandable-card" id="camera-card">
        <summary>3D Printer Camera</summary>
        <div class="camera-content">
          <div class="camera-placeholder" id="camera-placeholder">Loading camera stream...</div>
          <img id="camera-stream" class="camera-stream" alt="3D Printer Camera Stream" />
        </div>
      </details>
      <div class="card-grid" id="temperature-card">
        <div class="card">
          <p class="card-title">Temperature</p>
          <canvas id="gauge-temperature"></canvas>
        </div>
        <div class="card" id="humidity-card" style="display: none;">
          <p class="card-title">Humidity</p>
          <canvas id="gauge-humidity"></canvas>
        </div>
      </div>
    </div>
    <div style="position: fixed; bottom: 10px; right: 10px; color: #888; font-size: 12px;">
      Version: <span id="version">Loading...</span>
    </div>
    <script src="script.js"></script>
    <script>
      // Click printer status to cycle filament profile
      (function () {
        var statusBox = document.getElementById('printer-status');
        if (!statusBox) return;

        statusBox.addEventListener('click', function () {
          fetch('/filament', { method: 'POST' })
            .then(function (response) {
              if (!response.ok) {
                throw new Error('Failed to change filament');
              }
              return response.json();
            })
            .then(function () {
              if (typeof getReadings === 'function') {
                getReadings();
              }
            })
            .catch(function (err) {
              console.error(err);
            });
        });
      })();

      // Fetch version from server
      fetch('/version').then(r => r.text()).then(v => {
            var myObj = JSON.parse(v);
        document.getElementById('version').textContent = myObj.version;
      }).catch(() => {
        document.getElementById('version').textContent = 'Unknown';
      });
    </script>
  </body>
</html>
